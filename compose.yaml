# Laboratório completo em containers: páginas + bancada de testbench + modelo da oficina.
#
#   docker compose up -d                 # abre em http://localhost:8088
#   docker compose logs -f modelo        # espere "server is listening" na primeira vez
#   docker compose down                  # desliga (os pesos ficam no volume)
#
# Defina o nome da sua máquina antes de subir, para os resultados saírem com ele:
#   PowerShell:  $env:BANCADA_MAQUINA = "notebook-bia"
#   bash:        export BANCADA_MAQUINA=notebook-bia
name: pdc-slms

include:
  - docker/compose.yaml          # serviço "modelo" (llama.cpp server) e "bench" (perfil bench)

services:
  bancada:
    image: python:3.12-slim       # só biblioteca padrão: nada para instalar
    working_dir: /repo
    command: ["python", "testbench/servidor.py", "--host", "0.0.0.0", "--porta", "8000",
              "--modelo-url", "http://modelo:8080"]
    environment:
      BANCADA_MAQUINA: ${BANCADA_MAQUINA:-maquina-sem-nome}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-}
    ports:
      - "127.0.0.1:${BANCADA_PORTA:-8088}:8000"     # só no seu computador: a API da bancada executa comandos
    volumes:
      - ./:/repo                  # resultados vão para testbench/resultados/ no seu disco
    depends_on:
      - modelo
